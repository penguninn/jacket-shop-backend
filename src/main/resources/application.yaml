server:
  port: 8080

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

spring:
  application:
    name: jacket-shop-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=JacketShop;encrypt=true;trustServerCertificate=true;}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: update
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}

jwt:
  secret: ${JWT_SECRET}
  access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}
  refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:604800000}
  issuer: ${JWT_ISSUER:jacket-shop}

cloudinary:
  name: ${CLOUDINARY_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

sendgrid:
  from:
    email: ${SENDGRID_FROM_EMAIL}
    name: ${SENDGRID_FROM_NAME}

goship:
  url: ${GOSHIP_URL:https://api.goship.io/api/v2/}
  token: ${GOSHIP_TOKEN}

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}

order:
  pos:
    draft:
      timeout:
        minutes: ${ORDER_POS_DRAFT_TIMEOUT_MINUTES:30}
      check:
        interval: ${ORDER_POS_DRAFT_CHECK_INTERVAL:300000}

upload:
  allowed-extensions: ${UPLOAD_ALLOWED_EXTENSIONS:jpg,jpeg,png,gif,webp}
  max-image-width: ${UPLOAD_MAX_IMAGE_WIDTH:2048}
  max-image-height: ${UPLOAD_MAX_IMAGE_HEIGHT:2048}

logging:
  level:
    org:
      springframework:
        security: DEBUG
